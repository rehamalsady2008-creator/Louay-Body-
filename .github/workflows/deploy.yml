name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies without lock file
        run: npm install --package-lock=false

      - name: Install Capacitor CLI and Core
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios --package-lock=false

      - name: Build Web App
        run: npm run build

      - name: Create Capacitor Config File
        run: |
          echo '{
            "appId": "com.louay.app",
            "appName": "Louay App",
            "webDir": "dist",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      - name: Add iOS Platform
        run: npx cap add ios || true

      - name: Overwrite Podfile with iOS 14 Target Directly
        run: |
          cd ios/App
          echo "platform :ios, '14.0'" > Podfile
          echo "use_frameworks!" >> Podfile
          echo "" >> Podfile
          echo "target 'App' do" >> Podfile
          echo "  pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'" >> Podfile
          echo "  pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'" >> Podfile
          echo "end" >> Podfile
          cd ../..

      - name: Run Clean Pod Install
        run: |
          cd ios/App
          pod install
          cd ../..

      - name: Final Capacitor Sync
        run: npx cap sync ios
