name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI and Core
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor Config
        run: npx cap init "Louay App" "com.louay.app" --web-dir dist --force

      - name: Add Capacitor iOS Platform
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios
