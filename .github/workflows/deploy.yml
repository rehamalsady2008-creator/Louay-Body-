name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies without lock file
        run: npm install --package-lock=false

      - name: Install Capacitor CLI and Core
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios --package-lock=false

      - name: Build Web App
        run: npm run build

      - name: Create Capacitor Config File
        run: |
          echo '{
            "appId": "com.louay.app",
            "appName": "Louay App",
            "webDir": "dist",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      - name: Add iOS Platform
        run: npx cap add ios || true

      - name: Fix Podfile Min Deployment Target to 14.0
        run: |
          cd ios/App
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '14.0'/" Podfile
          cd ../..

      - name: Final Capacitor Sync
        run: npx cap sync ios
