    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install # أو bun install حسب ما تستخدم

      - name: Build Web App
        run: npm run build

      - name: Add Capacitor iOS Platform
        # نستخدم --no-pod-install لتجنب الفشل في أول مرة قبل تعديل الملف
        run: npx cap add ios || true 

      - name: Fix iOS Deployment Target in Podfile
        run: |
          # هذا الأمر يبحث عن سطر المنصة في الـ Podfile ويغيره إلى 14.0
          sed -i "s/platform :ios, '11.0'/platform :ios, '14.0'/g" ios/App/Podfile
          sed -i "s/platform :ios, '12.0'/platform :ios, '14.0'/g" ios/App/Podfile
          sed -i "s/platform :ios, '13.0'/platform :ios, '14.0'/g" ios/App/Podfile
          # للتأكد من شمولية الحل لجميع المكتبات التابعة
          echo "post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
              end
            end
          end" >> ios/App/Podfile

      - name: Run Pod Install Manually
        working-directory: ios/App
        run: pod install
