name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI and Core
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Build Web App
        run: npm run build

      - name: Create Capacitor Config File with iOS Target
        run: |
          echo '{
            "appId": "com.louay.app",
            "appName": "Louay App",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "ios": {
              "minDeploymentTarget": "14.0"
            }
          }' > capacitor.config.json

      - name: Initialize Capacitor iOS Platform Only
        run: npx cap add ios --deployment-target 14.0 || true

      - name: Force Fix Podfile Target
        run: |
          cd ios/App
          echo "platform :ios, '14.0'" > Podfile
          echo "target 'App' do" >> Podfile
          echo "  use_frameworks!" >> Podfile
          echo "  pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'" >> Podfile
          echo "  pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'" >> Podfile
          echo "end" >> Podfile
          cd ../..

      - name: Run Clean Pod Install & Sync
        run: |
          cd ios/App
          pod install --repo-update
          cd ../..
          npx cap sync ios
