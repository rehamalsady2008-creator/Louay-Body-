name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Build Web App
        run: npm run build

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.louay.app",
            "appName": "Louay App",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Capacitor iOS Platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios --no-sync
          fi

      - name: Fix iOS Deployment Target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path("ios/App/Podfile")

          if not podfile.exists():
              raise SystemExit("Podfile not found")

          text = podfile.read_text()

          # Set minimum iOS version
          if re.search(r"platform\s*:ios", text):
              text = re.sub(
                  r"platform\s*:ios.*",
                  "platform :ios, '15.0'",
                  text,
                  count=1
              )
          else:
              text = "platform :ios, '15.0'\n" + text

          # Force all CocoaPods targets to iOS 15
          post_install = """
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          """

          if "config.build_settings['IPHONEOS_DEPLOYMENT_TARGET']" not in text:
              text += post_install

          podfile.write_text(text)
          PY

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Set Xcode Deployment Target
        run: |
          find ios/App -name "*.pbxproj" -type f -exec sed -i '' \
          's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} \;

      - name: Build iOS
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
