name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Add Capacitor iOS Platform
        # نستخدم || true لأن المنصة قد تكون موجودة بالفعل
        run: npx cap add ios || true

      - name: Smart Fix Podfile Target
        run: |
          # 1. تعديل سطر المنصة الرئيسي في ملف الـ Podfile إلى 15.0
          # نستخدم sed بطريقة Mac (مع علامات تنصيص فارغة) لتعديل السطر الموجود فقط
          sed -i '' "s/platform :ios, '.*'/platform :ios, '15.0'/g" ios/App/Podfile
          
          # 2. إضافة كود التأكيد لجميع المكتبات التابعة في نهاية الملف
          # هذا يضمن أن كل Pod يتم تحميله سيجبر على استخدام نسخة 15.0
          echo "
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end" >> ios/App/Podfile

      - name: Run Pod Install
        working-directory: ios/App
        run: |
          pod repo update
          pod install

      - name: Capacitor Sync
        run: npx cap sync ios
