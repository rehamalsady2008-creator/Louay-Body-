name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          # تثبيت Capacitor CLI بشكل صريح لضمان توفر أمر 'cap'
          npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Build Web App
        run: |
          npm run build
          # إنشاء مجلد المخرجات يدوياً إذا لم يقم أمر build بإنشائه
          mkdir -p dist

      - name: Create Capacitor Config
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.louay.app",
            "appName": "Louay App",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Capacitor iOS Platform
        run: |
          rm -rf ios
          # استخدام npx @capacitor/cli بدلاً من npx cap لضمان العثور على المنفذ
          npx @capacitor/cli add ios

      - name: Smart Fix Podfile Target
        run: |
          if [ -f ios/App/Podfile ]; then
            # رفع نسخة iOS إلى 15.0 لضمان التوافق مع أحدث المكتبات
            sed -i '' "s/platform :ios, '.*'/platform :ios, '15.0'/g" ios/App/Podfile
            echo "
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end" >> ios/App/Podfile
          else
            echo "Error: Podfile not found!"
            exit 1
          fi

      - name: Run Pod Install
        working-directory: ios/App
        run: |
          pod repo update
          pod install

      - name: Capacitor Sync
        run: npx @capacitor/cli sync ios
