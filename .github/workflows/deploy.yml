name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: |
          npm run build
          # التأكد من وجود مجلد المخرجات، إذا كان اسمه مختلفاً عن dist قم بتغييره هنا
          mkdir -p dist 

      - name: Create Capacitor Config
        run: |
          # هذه الخطوة إجبارية ليتمكن Capacitor من إنشاء مشروع iOS
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.louay.app",
            "appName": "Louay App",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Capacitor iOS Platform
        run: |
          # حذف المجلد القديم إذا وجد لضمان بناء نظيف
          rm -rf ios
          npx cap add ios

      - name: Smart Fix Podfile Target
        run: |
          # التأكد من وجود الملف قبل محاولة تعديله
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, '.*'/platform :ios, '15.0'/g" ios/App/Podfile
            echo "
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end" >> ios/App/Podfile
          else
            echo "Error: Podfile not found!"
            exit 1
          fi

      - name: Run Pod Install
        working-directory: ios/App
        run: |
          pod repo update
          pod install

      - name: Capacitor Sync
        run: npx cap sync ios
