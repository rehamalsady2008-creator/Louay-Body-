name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI and Core
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Build Web App
        run: npm run build

      - name: Create Capacitor Config File
        run: |
          echo '{
            "appId": "com.louay.app",
            "appName": "Louay App",
            "webDir": "dist",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      - name: Add Capacitor iOS Platform without pod install
        run: npx cap add ios --no-pod-install

      - name: Fix iOS Deployment Target in Podfile
        run: |
          cd ios/App
          sed -i '' "s/platform :ios, '.*'/platform :ios, '14.0'/" Podfile
          cd ../..

      - name: Run Pod Install Manually
        run: |
          cd ios/App
          pod install
          cd ../..

      - name: Sync Capacitor iOS
        run: npx cap sync ios
